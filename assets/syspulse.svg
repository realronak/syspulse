<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a26"/>
      <stop offset="100%" stop-color="#0d0e15"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Badge -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#272d42" stroke-width="2"/>

  <!-- Subtle Circular Dial Track -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#1f2436" stroke-width="4" stroke-dasharray="4 6"/>

  <!-- Glowing Pulse Waveform -->
  <path d="M 22 64 L 40 64 L 48 48 L 56 82 L 66 32 L 76 92 L 84 56 L 90 64 L 106 64"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Activity Center Point -->
  <circle cx="66" cy="32" r="3.5" fill="#ffffff"/>
  <circle cx="76" cy="92" r="3.5" fill="#ffffff"/>
</svg>
